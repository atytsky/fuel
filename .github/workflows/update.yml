name: Update fuel data

on:
  schedule:
    - cron: '7 * * * *'      # каждый час (UTC); GitHub может опаздывать на 5-15 мин
  workflow_dispatch:          # ручной запуск из вкладки Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Раннеры GitHub находятся в США, а gpnbonus.ru их не пускает (таймаут).
      # Поэтому шаг не обязателен: если данные получить не удалось, деплоится
      # последний закоммиченный снимок data/stations.json.
      - name: Parse stations
        id: parse
        continue-on-error: true
        run: python3 parser.py --delay 0.5

      - name: Show summary
        run: |
          if [ "${{ steps.parse.outcome }}" != "success" ]; then
            echo "> Свежие данные получить не удалось (gpnbonus.ru недоступен с раннера GitHub). Опубликован последний закоммиченный снимок." >> $GITHUB_STEP_SUMMARY
          fi
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, collections
          d = json.load(open('data/stations.json'))
          c = collections.Counter(s['fuel']['status'] for s in d['stations'])
          print(f"## {d['fuel']['shortTitle']} — {d['total']} АЗС, ошибок: {d['errors']}\n")
          print(f"Данные на {d['generatedAt']}\n")
          for k, v in c.most_common():
              print(f"- {k}: {v}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
