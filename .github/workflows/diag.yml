name: Diag connectivity
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe gpnbonus.ru
        run: |
          set +e
          echo "--- DNS"; getent hosts gpnbonus.ru
          echo "--- TCP 443"; timeout 15 bash -c 'cat < /dev/null > /dev/tcp/gpnbonus.ru/443' && echo "tcp ok" || echo "tcp FAIL"
          echo "--- HEAD /"; curl -s -m 20 -o /dev/null -w 'code=%{http_code} connect=%{time_connect} total=%{time_total}\n' -A "Mozilla/5.0" https://gpnbonus.ru/ ; echo "exit=$?"
          echo "--- GET /fuel/refuel-map"; curl -s -m 20 -o /dev/null -w 'code=%{http_code} total=%{time_total}\n' -A "Mozilla/5.0" https://gpnbonus.ru/fuel/refuel-map ; echo "exit=$?"
          echo "--- POST /api/stations/list"; curl -s -m 30 -o /dev/null -w 'code=%{http_code} connect=%{time_connect} total=%{time_total}\n' -X POST -A "Mozilla/5.0" -H 'Content-Type: application/json' -H 'Accept: application/json' -H 'X-Requested-With: XMLHttpRequest' -H 'Referer: https://gpnbonus.ru/fuel/refuel-map' -d '{}' https://gpnbonus.ru/api/stations/list ; echo "exit=$?"
